<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Vellum architectural plan synthetic drawing</title>
  <desc id="desc">Original synthetic architectural floor plan generated for Vellum marketing visuals.</desc>
  <defs>
    <pattern id="paperGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e8e0d2" stroke-width="0.55"/>
    </pattern>
    <pattern id="minorGrid" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M6 0H0V6" fill="none" stroke="#f2ede3" stroke-width="0.35"/>
    </pattern>
    <style>
      .bg{fill:#fbfaf6}.sheet{fill:#fffdf8;stroke:#171613;stroke-width:2}.grid{fill:url(#paperGrid)}.minor{fill:url(#minorGrid)}
      .wall{stroke:#171613;stroke-width:8;fill:none;stroke-linecap:square;stroke-linejoin:miter}.thin{stroke:#171613;stroke-width:2;fill:none}.hair{stroke:#171613;stroke-width:1;fill:none}.dash{stroke:#171613;stroke-width:1.4;stroke-dasharray:9 7;fill:none}.dim{stroke:#5f5a50;stroke-width:1.1;fill:none}.txt{font-family:Arial, Helvetica, sans-serif;fill:#171613}.mono{font-family:Courier New, monospace;fill:#171613}.muted{fill:#6e685e}.sienna{stroke:#b6543a;fill:none}.stamp{fill:#b6543a}.light{fill:#f3efe6;stroke:#d8d0bf}.room{font-size:17px;font-weight:700;letter-spacing:.08em}.note{font-size:12px;letter-spacing:.12em}.small{font-size:10px;letter-spacing:.14em}.title{font-size:20px;font-weight:700}.cart{font-size:11px;letter-spacing:.12em}.label{font-size:9px;letter-spacing:.16em;fill:#6e685e}
    </style>
  </defs>
